name: Deploy to App Platform

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCTL_VERSION: 1.177.0
      IMAGE_REPOSITORY: ghcr.io/ekuboprotocol/indexer
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun test --timeout 15000

      # Pinned: with `latest` the action asks the GitHub API for the newest
      # release and silently falls back to v1.98.1 when that call fails, which
      # rejects the `vpc` field in .do/app.yaml (EKU-630). A failed download of
      # the pinned version also falls back, so the next step checks it.
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}
          version: ${{ env.DOCTL_VERSION }}

      - name: Check doctl version
        run: |
          installed=$(doctl version | head -n1)
          echo "$installed"
          if [ "$installed" != "doctl version ${DOCTL_VERSION}-release" ]; then
            echo "::error::expected doctl ${DOCTL_VERSION}, got: $installed"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install envsubst
        run: |
          sudo curl -sSL https://github.com/a8m/envsubst/releases/download/v1.4.2/envsubst-Linux-x86_64 -o /usr/local/bin/envsubst
          sudo chmod +x /usr/local/bin/envsubst

      # Fails closed on any secret the spec references that is unset or empty.
      # An empty DRPC_API_KEY is the dangerous one: dRPC answers `dkey=` with
      # its free tier rather than an error (EKU-523). The rendered spec holds
      # every key, so it goes to a file that is never printed and is removed.
      - name: Deploy App
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
          PG_CONNECTION_STRING: ${{ secrets.PRIVATE_PG_CONNECTION_STRING }}
          VPC_ID: ${{ secrets.VPC_ID }}
        run: |
          spec="$RUNNER_TEMP/app.yaml"
          trap 'rm -f "$spec"' EXIT
          envsubst -no-unset -no-empty -i .do/app.yaml -o "$spec"
          if lines=$(grep -nE 'dkey=($|[&"'"'"'[:space:],])' "$spec" | cut -d: -f1 | paste -sd, -); [ -n "$lines" ]; then
            echo "::error::rendered spec has an empty dkey= on line(s) $lines"
            exit 1
          fi
          doctl apps create --spec "$spec" --upsert
