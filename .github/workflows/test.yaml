name: Tests

on:
  push:

jobs:
  unit-tests:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest
    # The concurrent-persist test needs a real server; PGlite has a single
    # connection. Postgres 18 matches production.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_PG_CONNECTION_STRING: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun ci

      # Every step runs even when an earlier one fails, so one push reports
      # every kind of problem at once.
      - name: Format
        run: bun run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      # Runs the "test" script so CI and local runs share one timeout.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: bun run test
