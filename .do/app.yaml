name: ekubo-indexer
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: PRODUCTION
  - key: NODE_TLS_REJECT_UNAUTHORIZED
    scope: RUN_TIME
    value: "0"
  - key: PG_CONNECTION_STRING
    scope: RUN_TIME
    type: SECRET
    value: ${PG_CONNECTION_STRING}
  - key: RESTART_DELAY_SECONDS
    scope: RUN_TIME
    value: "1"
workers:
  # Starknet range-reads its own RPC, the same way every EVM worker does, so the
  # one endpoint rule below applies to it too.
  #
  # The path carries the JSON-RPC spec version rather than the `/v2/` the EVM
  # URLs use, and v0.10 is a floor rather than a preference: it is the first
  # version where `EMITTED_EVENT` carries `transaction_index` and `event_index`,
  # which are packed into `event_id`. On v0.9 the stream refuses to index rather
  # than defaulting them, so a downgrade here stops the worker instead of
  # silently writing wrong primary keys.
  #
  # NOTE: starknet-mainnet must be enabled on the Alchemy app this key belongs
  # to before this deploys; it was an EVM-only app until this change.
  - name: starknet-mainnet
    image: &indexer-image
      registry_type: GHCR
      registry: ghcr.io
      repository: ekuboprotocol/indexer
      tag: ${IMAGE_TAG}
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: STARKNET_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://starknet-mainnet.g.alchemy.com/starknet/version/rpc/v0_10/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: mainnet
    run_command: scripts/restart.sh bun src/starknet.ts
  # Every EVM worker points at exactly one endpoint.
  #
  # A comma-separated fallback list reads like redundancy but is the opposite
  # for an indexer: viem routes per request, so two calls in the same poll can
  # be answered by backends with different views of the chain. That is how the
  # opt-mainnet worker came to restart every ~80 s, and a crash is the benign
  # outcome -- the dangerous one is a log query answered by a node that is
  # behind, which returns fewer events and no error.
  #
  # One endpoint fails by stopping, and stopping is safe: the cursor is durable
  # and indexing resumes exactly where it left off.
  - name: eth-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: base-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: base-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: rhc-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: NETWORK
        scope: RUN_TIME
        value: rhc-mainnet
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    run_command: scripts/restart.sh bun src/evm.ts
  - name: arb-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: arb-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: opt-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: opt-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: bsc-mainnet
