    run_command: scripts/restart.sh bun src/evm.ts
  - name: unichain-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://unichain-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: unichain-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: polygon-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: polygon-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: monad-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://monad-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: monad
    run_command: scripts/restart.sh bun src/evm.ts
  - name: worldchain-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://worldchain-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: worldchain-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: megaeth-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://megaeth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: megaeth
    run_command: scripts/restart.sh bun src/evm.ts
  - name: ink-mainnet
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://ink-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
        value: ink-mainnet
    run_command: scripts/restart.sh bun src/evm.ts
  - name: token-price-sync
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: TOKEN_PRICE_SYNC_INTERVAL_MS
        scope: RUN_TIME
        value: "60000"
      - key: MAX_QUOTER_REQUESTS_PER_MINUTE
        scope: RUN_TIME
        value: "300"
      - key: COINGECKO_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${COINGECKO_API_KEY}
      # The Ekubo quoter and Sushi fetchers cover liquid tokens every minute;
      # CoinGecko is the fallback for the illiquid tail, where hourly is plenty
      # (prices stay valid for three intervals). Each cg1 cycle re-requests the
      # ~8k tokens CoinGecko prices across 12 chains, roughly 90 requests, so
      # the interval sets the monthly credit spend (EKU-340: 900s exhausted
      # the account mid-month).
      - key: COINGECKO_TOKEN_PRICE_SYNC_INTERVAL_SECONDS
        scope: RUN_TIME
        value: "3600"
      # cgn prices every chain's native currency in one request per cycle.
      # Gnosis, Unichain, Monad, World Chain, MegaETH and Ink have no other
      # native-currency source, so it stays at 15 minutes (~2.9k credits/month).
      - key: COINGECKO_NATIVE_PRICE_SYNC_INTERVAL_SECONDS
        scope: RUN_TIME
        value: "900"
      - key: CHAINLINK_TOKEN_PRICE_SYNC_INTERVAL_SECONDS
        scope: RUN_TIME
        value: "60"
      - key: CHAINLINK_FEED_CATALOG_REFRESH_INTERVAL_SECONDS
        scope: RUN_TIME
        value: "3600"
      - key: CHAINLINK_TOKEN_PRICE_CONFIG
        scope: RUN_TIME
        type: SECRET
        value: >-
          {"1":{"rpcUrls":["https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-mainnet.json","excludeTokens":["0x853d955aCEf822Db058eb8505911ED77F175b99e"]},"8453":{"rpcUrls":["https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-ethereum-mainnet-base-1.json","excludeTokens":["0x5b8a884496792F754dB6F92F6EacCEb376ed8e40","0x57F5fbD3DE65DFC0bd3630F732969e5fb97E6d37","0xFCa95aeb5bF44aE355806A5ad14659c940dC6BF7"]},"42161":{"rpcUrls":["https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-ethereum-mainnet-arbitrum-1.json","excludeTokens":["0x349fc93da004a63F3B1343361465981330A40B25","0x83d292C02a5035F05d6ab3337025f33f6fa0c246"]},"4663":{"rpcUrls":["https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-robinhood-mainnet.json"},"10":{"rpcUrls":["https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-ethereum-mainnet-optimism-1.json","excludeTokens":["0xCEf8A7008310A15b1B1489D88b0E6fe51329b05a"]},"56":{"rpcUrls":["https://bnb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-bsc-mainnet.json","excludeTokens":["0x17fd3cAa66502C6F1CbD5600D8448f3aF8f2ABA1"]},"100":{"rpcUrls":["https://gnosis-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-xdai-mainnet.json"},"130":{"rpcUrls":["https://unichain-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-ethereum-mainnet-unichain-1.json"},"137":{"rpcUrls":["https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-matic-mainnet.json"},"143":{"rpcUrls":["https://monad-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-monad-mainnet.json"},"4326":{"rpcUrls":["https://megaeth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-megaeth-mainnet.json"},"57073":{"rpcUrls":["https://ink-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"],"catalogUrl":"https://reference-data-directory.vercel.app/feeds-ethereum-mainnet-ink-1.json"}}
    run_command: bun src/price-sync/index.ts
jobs:
  - name: run-migrations
    kind: PRE_DEPLOY
    image: *indexer-image
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: NO_RESTART
        scope: RUN_TIME
        value: "1"
    run_command: bun scripts/migrate.ts
vpc:
  id: ${VPC_ID}
