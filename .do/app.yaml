    instance_count: 1
    envs:
      - key: EVM_RPC_URL
        scope: RUN_TIME
        type: SECRET
        value: "https://bnb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
      - key: NETWORK
        scope: RUN_TIME
